# PR-Agent Configuration
# Docs: https://qodo-merge-docs.qodo.ai/usage-guide/configuration_options/

[config]
model = "openai/gemini-3-pro-preview"
fallback_models = ["openai/zai/glm-4.7"]
ai_timeout = 180
verbosity_level = 0

[pr_reviewer]
require_security_review = true
require_tests_review = true
require_estimate_effort_to_review = true
enable_review_labels_security = true
enable_review_labels_effort = true
num_max_findings = 5
extra_instructions = """
Focus on:
- Security vulnerabilities (XSS, injection, auth issues)
- Performance issues (unnecessary re-renders, N+1 queries)
- Next.js/React best practices (proper use of hooks, server/client boundaries)
- Prisma query optimization and proper error handling
- TypeScript type safety
"""

[pr_description]
publish_labels = true
enable_pr_type = true
enable_pr_diagram = true
use_bullet_points = true
generate_ai_title = false

[pr_code_suggestions]
num_code_suggestions_per_chunk = 4
focus_only_on_problems = true
suggestions_score_threshold = 5
commitable_code_suggestions = false

