[config]
model = "openai/gemini-3-pro-preview"
fallback_models = ["openai/zai/glm-4.7"]
custom_model_max_tokens = 8192

[pr_reviewer]
auto_review = true
extra_instructions = "Focus on security vulnerabilities, performance issues, and Next.js/React best practices"
enable_review_labels_security = true
enable_review_labels_effort = true

[pr_description]
auto_describe = true
publish_labels = true

[pr_code_suggestions]
num_code_suggestions = 4
