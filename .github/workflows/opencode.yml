name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".github/workflows/opencode.yml"
      - ".vscode/**"
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  opencode:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run OpenCode
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: proxy/openai/gpt-5.4(high)
          use_github_token: true
          share: false
          prompt: |
            Review this pull request:
            - Focus on security vulnerabilities (XSS, injection, auth issues)
            - Focus on performance issues (unnecessary re-renders, N+1 queries)
            - Check Next.js/React best practices (proper use of hooks, server/client boundaries)
            - Check Prisma query optimization and proper error handling
            - Check TypeScript type safety
            - Focus only on actionable problems, not praise
