name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC__API_BASE: ${{ secrets.ANTHROPIC_API_BASE }}
          CONFIG__MODEL: "anthropic/gemini-3-pro-preview"
          CONFIG__FALLBACK_MODELS: "[\"anthropic/zai/glm-4.7\"]"
